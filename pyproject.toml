[project]
name = "protein-embeddings"
version = "0.1.0"
description = "Protein embedding experiments"
readme = "README.md"
requires-python = ">=3.9, <3.10"
dependencies = [
  "torch==2.8.0",
  "numpy==2.0.2",
  "pandas==2.3.3",
  "proteingym",
  "pyarrow==21.0.0",
  "tqdm==4.67.3",
]

[dependency-groups]
dev = [
  "ruff>=0.6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
proteingym = { git = "https://github.com/OATML-Markslab/ProteinGym.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
